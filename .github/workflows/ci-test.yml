name: CI — Tests + Cobertura + Sonar (reusable)

# Workflow REUSABLE de CALIDAD: tests unitarios + cobertura (lcov) + análisis SonarQube.
# Cada repo de servicio lo invoca desde su ci.yml (en PRs y ramas feature) y desde su
# build.yml (como GATE: sin tests verdes NO hay build/deploy).
#
# Sonar es OPCIONAL: el paso solo corre si el secret SONAR_TOKEN existe en el repo que
# llama (con `secrets: inherit`). Sin el secret, el CI sigue siendo tests + cobertura.
#   - SonarCloud:  SONAR_TOKEN + SONAR_HOST_URL=https://sonarcloud.io (y sonar.organization
#     en el sonar-project.properties del repo).
#   - SonarQube self-hosted: SONAR_TOKEN + SONAR_HOST_URL=<tu servidor accesible>.

on:
  workflow_call:
    inputs:
      service:
        description: "Nombre corto del servicio (para el artifact de cobertura)"
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "20"
    # Los repos que llaman deben pasar SOLO estos secrets (nunca `secrets: inherit`,
    # que expone todos los secrets del repo a este workflow — regla Sonar S7635).
    secrets:
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: tests + cobertura · ${{ inputs.service }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo → Sonar atribuye bien el "new code"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios
        run: npm test

      - name: Cobertura (lcov para Sonar + html navegable)
        run: npm run coverage

      - name: Publicar cobertura como artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.service }}
          path: coverage/
          retention-days: 7

      # ── Sonar (solo si el secret existe — inofensivo si no) ────────────────
      - name: ¿Sonar configurado?
        id: sonar
        env:
          TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "on=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Análisis SonarQube
        if: steps.sonar.outputs.on == 'true'
        # Anclado a SHA de commit (inmutable) — un tag como v3 puede ser movido (Sonar S7637)
        uses: SonarSource/sonarqube-scan-action@13990a695682794b53148ff9f6a8b6e22e43955e # v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
